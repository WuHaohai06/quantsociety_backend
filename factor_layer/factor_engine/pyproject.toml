[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-engine"
version = "0.1.0"
description = "Skeleton quantitative factor engine"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
pandas = ["pandas>=2.0", "pyarrow>=14.0", "scipy>=1.10"]
# 可选加速 / 技术指标（Deep Research 阶段 A；TA-Lib 需系统库或预编译 wheel）
accel = ["bottleneck>=1.3", "numba>=0.58"]
talib = ["TA-Lib>=0.4.28"]
polars = ["polars>=0.20"]
parallel = ["joblib>=1.3"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
