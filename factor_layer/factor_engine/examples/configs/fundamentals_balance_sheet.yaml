factor:
  name: balance_sheet_rank_total_assets
  expr: rank(col("total_assets"))
  freq: 1d
  universe: equities
  description: 资产负债表 - 总资产截面排名，越高代表规模越大

data_source:
  type: cleaned_parquet
  root: /home/yluel/share/projects/massive_parquet/cleaned_massive_data/fundamentals/balance_sheet
  max_files: 3
  # cleaned_parquet 默认使用 align_time / ticker
  # start_date: "2010-01-01"   # 可选：限定时间范围左端（行级过滤）
  # end_date:   "2011-12-31"   # 可选：限定时间范围右端（行级过滤）

backend:
  type: pandas

engine:
  enable_cache: true

materialization:
  lake_root: /tmp/factor_engine_examples_lake
  factor_id: balance_sheet_rank_total_assets_v1
  # author: your_name
