  expr: zscore(col("revenue"))
  freq: 1d
  universe: equities
  description: 利润表 - 营业收入截面标准化，衡量相对营收规模

data_source:
  type: cleaned_parquet
  root: /home/yluel/share/projects/massive_parquet/cleaned_massive_data/fundamentals/income_statement
  max_files: 3
  # cleaned_parquet 默认使用 align_time / ticker
