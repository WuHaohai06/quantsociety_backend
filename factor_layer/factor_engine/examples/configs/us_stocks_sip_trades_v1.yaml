factor:
  name: trades_rank_price
  expr: rank(col("price"))
  freq: 1d
  universe: equities
  description: 逐笔成交 - 成交价格截面排名，反映股票价格相对高低水平

data_source:
  type: cleaned_parquet
  root: /home/yluel/share/projects/massive_parquet/cleaned_massive_data/us_stocks_sip/trades_v1
  max_files: 2
  # cleaned_parquet 默认使用 align_time / ticker
  # start_date: "2003-01-01"   # 可选：限定时间范围左端（行级过滤）
  # end_date:   "2003-12-31"   # 可选：限定时间范围右端（行级过滤）

backend:
  type: pandas

engine:
  enable_cache: true

materialization:
  lake_root: /tmp/factor_engine_examples_lake
  factor_id: trades_rank_price_v1
  # author: your_name
