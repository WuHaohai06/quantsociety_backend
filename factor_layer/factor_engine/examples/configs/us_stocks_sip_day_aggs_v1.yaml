  freq: 1d
  universe: equities
  description: 日K线 - 3日收盘价均线截面排名，动量方向因子

data_source:
  type: cleaned_parquet
  root: /home/yluel/share/projects/massive_parquet/cleaned_massive_data/us_stocks_sip/day_aggs_v1
